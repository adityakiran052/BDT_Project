services:
  couchdb:
    image: couchdb:3.5
    user: "5984:5984"
    ports:
      - "127.0.0.1:5984:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Set COUCHDB_USER in .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./couchdb.ini:/opt/couchdb/etc/local.d/single-node.ini:ro
volumes:
  couchdb-data:
